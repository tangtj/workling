# GHCR 使用 GITHUB_TOKEN 的 packages:write；包须允许此仓库 Actions 写入。
# 私有包拉取需 read:packages classic PAT；公开包可匿名拉取。
# 工作流可写 GHCR 与 Release，因此不在 pull_request 上触发。
name: 发布
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag，如 v0.2.0
        required: true
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    timeout-minutes: 30
    steps:
      - name: 校验标签
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == push ]]; then TAG="$REF_NAME"; else TAG="$INPUT_TAG"; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo '非法 tag' >&2; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: 安装依赖并检查
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{raw}},value=${{ env.TAG }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ env.TAG }},enable=${{ !contains(env.TAG, '-') }}
          flavor: latest=${{ !contains(env.TAG, '-') }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: WORKLING_VERSION=${{ env.TAG }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 主体镜像不含 Pi、codex 与 agent 工具，任务在 worker 镜像里运行；同版本一并发布，compose 部署按版本号取用。
      - name: 读取契约版本
        run: |
          contract=$(bun -e 'import { CONTRACT_VERSION } from "./src/contract/spec.ts"; console.log(CONTRACT_VERSION)')
          echo "CONTRACT=$contract" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@v5
        id: worker_metadata
        with:
          images: ghcr.io/${{ github.repository }}-worker
          tags: |
            type=semver,pattern={{raw}},value=${{ env.TAG }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ env.TAG }},enable=${{ !contains(env.TAG, '-') }}
            type=raw,value=contract-${{ env.CONTRACT }},enable=${{ !contains(env.TAG, '-') }}
          flavor: latest=${{ !contains(env.TAG, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            WORKER_VERSION=${{ env.TAG }}
            WORKER_CONTRACT=${{ env.CONTRACT }}
          tags: ${{ steps.worker_metadata.outputs.tags }}
          labels: ${{ steps.worker_metadata.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      # 镜像信息追加在说明末尾：版本面板只展示说明开头几行，更新内容应在前。
      # 网页上先建好的 Release 只补镜像段落，不覆盖已有说明。
      - name: 创建或补充 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          marker='## Docker 镜像'
          image_notes=$(printf '%s\n\n```bash\ndocker pull %s:%s\n```\n\nDigest：`%s`\n' "$marker" "$image" "$TAG" "$DIGEST")
          if gh release view "$TAG" >/dev/null 2>&1; then
            body=$(gh release view "$TAG" --json body --jq .body)
            if [[ "$body" == *"$marker"* ]]; then
              echo "Release ${TAG} 已包含镜像信息，跳过"
            else
              gh release edit "$TAG" --notes "$(printf '%s\n\n%s' "$body" "$image_notes")"
            fi
          else
            notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body)
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" --title "$TAG" --verify-tag --notes "$(printf '%s\n\n%s' "$notes" "$image_notes")" "${flags[@]}"
          fi
